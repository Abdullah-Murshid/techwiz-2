{% extends "base.html" %}

{% block auth_content %}
<div class="auth-card">
    <div class="auth-header">
        <div style="display: flex; align-items: center; gap: 8px; margin-bottom: 8px;">
            <svg class="brand-icon" style="width: 24px; height: 24px;" viewBox="0 0 24 24"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>
            <h1 style="font-size: 18px; font-weight: 600;">AssureX Claim Engine</h1>
        </div>
        <p style="font-size: 13px; color: var(--text-muted); margin-bottom: 0;">Enterprise Claim Verification & Intelligence</p>
    </div>

    <div class="auth-tabs">
        <a href="{{ url_for('login', mode='login') }}" class="auth-tab {% if mode != 'register' %}active{% endif %}">Account Login</a>
        <a href="{{ url_for('login', mode='register') }}" class="auth-tab {% if mode == 'register' %}active{% endif %}">Register User</a>
    </div>

    {% if mode != 'register' %}
    <form action="{{ url_for('login') }}" method="POST">
        <input type="hidden" name="action" value="login">
        <div class="form-group">
            <label class="form-label" for="username">Username</label>
            <input type="text" id="username" name="username" class="form-input" value="admin" required autofocus>
        </div>
        <div class="form-group">
            <label class="form-label" for="password">Password</label>
            <input type="password" id="password" name="password" class="form-input" value="admin123" required>
        </div>
        <button type="submit" class="btn btn-primary" style="width: 100%; margin-top: 8px;">Sign In</button>
    </form>
    <div style="margin-top: 16px; font-size: 12px; color: var(--text-muted); line-height: 1.6;">
        <strong>Default Credentials:</strong><br>
        Admin: <code>admin</code> / <code>admin123</code><br>
        Reviewer: <code>reviewer</code> / <code>reviewer123</code>
    </div>
    {% else %}
    <form action="{{ url_for('login') }}" method="POST">
        <input type="hidden" name="action" value="register">
        <div class="form-group">
            <label class="form-label" for="new_username">Username</label>
            <input type="text" id="new_username" name="username" class="form-input" required>
        </div>
        <div class="form-group">
            <label class="form-label" for="new_email">Email Address</label>
            <input type="email" id="new_email" name="email" class="form-input" required>
        </div>
        <div class="form-group">
            <label class="form-label" for="new_fullname">Full Name</label>
            <input type="text" id="new_fullname" name="full_name" class="form-input" required>
        </div>
        <div class="form-group">
            <label class="form-label" for="new_password">Password</label>
            <input type="password" id="new_password" name="password" class="form-input" required>
        </div>
        <div class="form-group">
            <label class="form-label" for="role">Account Role</label>
            <select id="role" name="role" class="form-select">
                <option value="Customer">Customer</option>
                <option value="Service Center">Service Center</option>
                <option value="Reviewer">Reviewer</option>
                <option value="Admin">Admin</option>
            </select>
        </div>
        <button type="submit" class="btn btn-primary" style="width: 100%; margin-top: 8px;">Create Account</button>
    </form>
    {% endif %}
</div>
{% endblock %}
